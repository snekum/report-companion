# Builds app/ and deploys it to GitHub Pages. Inactive until the repository is
# pushed and Pages is set to "GitHub Actions" in the repository settings.
name: Deploy app to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**", "shared/**", "pipeline/fixtures/**", ".github/workflows/pages.yml"]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm test && npm run build
        working-directory: app
        env:
          # Set after the converted fine-tuned weights are hosted (owner approval needed).
          VITE_FINETUNED_MODEL_URL: ${{ vars.FINETUNED_MODEL_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
